apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace = 'com.delightlane.keyboard'
    compileSdk = 36

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty('RELEASE_STORE_FILE')
            if (storeFilePath != null) {
                storeFile rootProject.file(storeFilePath)
                storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId = "com.delightlane.keyboard"
        minSdk = 14
        targetSdk = 36
        versionCode = 25090801
        versionName = "250908-01"
        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = 'delightkeyboard-app-release.apk'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    dependencies {
        implementation 'org.greenrobot:eventbus:3.3.1'
        testImplementation 'junit:junit:4.13.2'
    }
}

dependencies {
    implementation 'androidx.preference:preference:1.2.1'
}
